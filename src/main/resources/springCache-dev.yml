spring:
  application:
    name: springBootCacheExample

  datasource:
    url: jdbc:h2:mem:productdb
    driverClassName: org.h2.Driver
    username: sa
    password: sid@123

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
  # ── Redis ──

  # ── Cache ──
  cache:
    type: redis

server:
  port: 8089

redis:
  shards:
    - host: localhost
      port: 6379
    - host: localhost
      port: 6380
